name: dataset-download-check

on:
  workflow_dispatch:
  push:
    branches: [feat/company-dataset]
    paths:
      - .github/workflows/dataset-download-check.yml
      - pipeline/sources.ts
      - pipeline/http.ts
      - pipeline/cli/download.ts

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dataset:download -- --only lca
      - name: Print manifest
        run: cat .cache/dataset/manifest.json
