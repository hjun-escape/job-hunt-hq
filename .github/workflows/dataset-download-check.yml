name: dataset-download-check

on:
  workflow_dispatch:
  push:
    branches: [feat/company-dataset]
    paths:
      - .github/workflows/dataset-download-check.yml
      - pipeline/sources.ts
      - pipeline/http.ts
      - pipeline/cli/download.ts

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dataset:download -- --only lca
      - name: Print manifest
        run: cat .cache/dataset/manifest.json
