  checked: "2026-11-18"
values:
  value:
    names:
      - Users first
      - Create with craft and beauty
      - Move with urgency and focus
      - Collaborate egolessly
      - Stay curious
      - Obsess over talent
    summary:
      en: >-
        Stripe's six operating principles put users first and ask staff to do careful, polished work, move
        fast on what matters most, work as one team without ego, keep learning, and help hire and grow strong
        people.
  kind: official
