  checked: "2026-11-15"
applicationRules:
  - value:
      en: >-
        You can apply and interview for at most 10 roles at a time. Each role may have its own interview
        process and recruiting contact.
      ko: 동시에 최대 10개 직무까지 지원하고 면접을 볼 수 있다. 직무마다 면접 절차와 채용 담당자가 다를 수 있다.
    kind: official
    sources:
      - url: https://www.amazon.jobs/content/en/faq/application
        seen: "2026-11-15"
    checked: "2026-11-15"
  - value:
      en: Use a single email address, and the amazon.jobs profile tied to it, for your whole job search.
      ko: 구직 활동 전체에 하나의 이메일 주소와 그에 연결된 amazon.jobs 프로필만 사용해야 한다.
    kind: official
    sources:
      - url: https://www.amazon.jobs/content/en/faq/application
        seen: "2026-11-15"
    checked: "2026-11-15"
  - value:
      en: Before an offer, your recruiter is the contact for questions about visa sponsorship and immigration.
      ko: 오퍼 전에는 비자 스폰서십과 이민 관련 질문을 담당 리크루터에게 해야 한다.
    kind: official
    sources:
      - url: https://www.amazon.jobs/content/en/faq/application
        seen: "2026-11-15"
    checked: "2026-11-15"
hiringProcess:
  value:
    en: >-
      Steps depend on the role: usually an online application, often assessments, a phone screen, then an
      interview loop of individual meetings with employees. Questions are behavioural and guided by the
      Leadership Principles; Amazon offers the STAR method as one way to answer.
    ko: >-
      직무마다 다르지만 보통 온라인 지원, 온라인 평가, 전화 면접을 거쳐 직원들과 한 명씩 만나는 인터뷰
      루프로 이어진다. 질문은 리더십 원칙에 따른 행동 질문이며, Amazon은 답변을 구성하는 한 가지 방법으로
      STAR 방식을 소개한다.
  kind: official
  sources:
    - url: https://www.amazon.jobs/content/en/how-we-hire
      seen: "2026-11-15"
    - url: https://amazon.jobs/content/en/how-we-hire/interview-loop
      seen: "2026-11-15"
  checked: "2026-11-15"
reapplyWait:
  - value:
      after: onsite
      wait:
        en: >-
          Reports range from 6 months to 2 years after a failed interview loop. Two Amazon-badged commenters
          put the wait after a "no recycle" verdict at 12 months or 2 years, and one ties that verdict to weak
          Leadership Principle answers. One reply suggests trying a different team.
        ko: >-
          인터뷰 루프에서 떨어진 뒤 6개월에서 2년까지 보고가 다양하다. Amazon 배지를 단 두 명은 "no recycle"
          판정 뒤 대기 기간을 각각 12개월, 2년이라고 하며, 그중 한 명은 이 판정을 리더십 원칙 답변이 약했던 것과
          연결한다. 다른 팀에 지원해 보라는 답도 하나 있다.
    kind: reported
