mission:
  value:
    en: >-
      Amazon frames its mission around customers: keep inventing to make their everyday lives better and
      simpler, across businesses that run from online retail and cloud computing to devices, entertainment
      and AI.
    ko: >-
      Amazon은 미션의 중심에 고객을 둔다. 온라인 쇼핑과 클라우드부터 기기, 엔터테인먼트, AI까지 여러 사업에서
      끊임없이 새로운 것을 만들어 고객의 일상을 더 낫고 간편하게 하겠다는 것이다.
  kind: official
  sources:
    - url: https://www.aboutamazon.com/about-us#:~:text=Amazon%E2%80%99s%20mission%20is,AI%20services%2C%20and%20more
      seen: "2026-11-15"
  checked: "2026-11-15"
values:
  value:
    names:
      - Customer Obsession
      - Ownership
      - Invent and Simplify
      - Are Right, A Lot
      - Learn and Be Curious
      - Hire and Develop the Best
      - Insist on the Highest Standards
      - Think Big
      - Bias for Action
      - Frugality
      - Earn Trust
      - Dive Deep
      - Have Backbone; Disagree and Commit
      - Deliver Results
      - Strive to be Earth's Best Employer
      - Success and Scale Bring Broad Responsibility
    summary:
      en: >-
        Amazon's 16 Leadership Principles, starting with "Customer Obsession", describe how staff are
        expected to work and decide. Interviewers test them with behavioural questions about past work.
      ko: >-
        "Customer Obsession"으로 시작하는 Amazon의 16가지 리더십 원칙은 직원이 일하고 결정하는 방식을 정한다.
        면접에서는 과거 경험을 묻는 행동 질문으로 이 원칙을 평가한다.
  kind: official
  sources:
    - url: https://www.amazon.jobs/content/en/our-workplace/leadership-principles
      seen: "2026-11-15"
    - url: https://amazon.jobs/content/en/how-we-hire/interview-loop
