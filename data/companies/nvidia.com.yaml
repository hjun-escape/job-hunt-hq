values:
  value:
    names:
      - Innovation
      - Intellectual Honesty
      - Speed and Agility
      - Excellence and Determination
      - One Team
    summary:
      en: >-
        NVIDIA's five core values, set out in its Code of Conduct, ask staff to take bold risks and learn
        fast, admit and share mistakes, adapt quickly, hold a very high bar through long efforts, and put the
        company ahead of their own team.
      ko: >-
        NVIDIA 행동 강령에 담긴 다섯 가지 핵심 가치로, 과감하게 시도하고 빨리 배우기, 실수를 솔직히 인정하고
        공유하기, 변화에 빠르게 적응하기, 오래 걸리는 일에도 높은 기준 지키기, 자기 팀보다 회사 전체를 먼저
        생각하기를 강조한다.
  kind: official
  sources:
