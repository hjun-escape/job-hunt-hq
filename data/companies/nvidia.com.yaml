applicationRules:
  - value:
      en: >-
        There is no official cap on applications, but NVIDIA recommends applying only to the three to five
        roles that best match your interests and experience.
      ko: 지원 수에 공식 제한은 없지만, NVIDIA는 관심사와 경력에 가장 잘 맞는 3~5개 직무에만 지원하라고 권한다.
    kind: official
    sources:
      - url: https://www.nvidia.com/en-us/about-nvidia/careers/how-we-hire/
        seen: "2026-11-15"
    checked: "2026-11-15"
  - value:
      en: >-
        Bringing in an outside tool NVIDIA has not approved, ChatGPT for example, during an interview ends
        your candidacy.
      ko: 면접 중에 NVIDIA가 허용하지 않은 ChatGPT 같은 외부 도구를 쓰면 지원 자격을 잃는다.
    kind: official
    sources:
      - url: https://www.nvidia.com/en-us/about-nvidia/careers/how-we-hire/
        seen: "2026-11-15"
    checked: "2026-11-15"
  - value:
      en: To be considered for an offer, you first need an onsite interview in person at an NVIDIA office.
      ko: 오퍼를 검토받으려면 먼저 NVIDIA 사무실에서 대면 면접을 봐야 한다.
    kind: official
    sources:
      - url: https://www.nvidia.com/en-us/about-nvidia/careers/how-we-hire/
        seen: "2026-11-15"
    checked: "2026-11-15"
hiringProcess:
  value:
    en: >-
      Apply online or with LinkedIn; selected candidates usually hear back within a couple of weeks.
      Interviews of 30 to 60 minutes follow by phone, video and in person with the hiring manager, team and
      other groups, often with coding for technical roles. Decisions take a few weeks.
    ko: >-
      웹사이트나 LinkedIn 프로필로 지원하며, 선발되면 보통 2주 안에 연락을 받는다. 이후 채용 매니저, 팀원,
      다른 부서 직원과 전화, 화상, 대면으로 30~60분씩 면접을 보고, 기술 직군은 코딩 과제를 풀기도 한다.
      결과는 몇 주 안에 나온다.
  kind: official
  sources:
    - url: https://www.nvidia.com/en-us/about-nvidia/careers/how-we-hire/
      seen: "2026-11-15"
  checked: "2026-11-15"
reapplyWait:
  - value:
      after: any
      wait:
        en: >-
          Most report no company-wide cooldown after a phone or onsite rejection, and some were interviewed
          by other teams soon after. One commenter says the system blocks reapplying to the same requisition;
          another mentions 12 months. A team that remembers you may want new experience.
        ko: >-
          전화 면접이나 최종 면접에서 떨어져도 회사 전체에 걸친 대기 기간은 없다는 보고가 대부분이며, 곧바로
          다른 팀과 면접을 본 사례도 있다. 같은 공고 번호에는 시스템상 다시 지원할 수 없다는 댓글이 하나 있고,
          12개월이라는 답도 하나 있다. 같은 팀에 다시 지원한다면 그동안 쌓은 새 경력을 보여 주는 것이 좋다.
