applicationRules:
  - value:
      en: >-
        In technical interviews you are expected to use the AI assistant built into the interview tool.
        No outside AI tools or help are allowed.
      ko: 기술 면접에서는 면접 도구에 내장된 AI 어시스턴트를 사용하도록 되어 있으며, 외부 AI 도구나 도움은 허용되지 않는다.
    kind: official
    sources:
      - url: https://www.metacareers.com/hiring-process/
        seen: "2026-11-15"
    checked: "2026-11-15"
  - value:
      en: >-
        You can apply to more than one role if you meet each role's minimum qualifications. The careers
        site keeps one resume per applicant, so write it to cover every role you pursue.
      ko: >-
        각 직무의 최소 자격을 갖추면 여러 직무에 지원할 수 있다. 채용 사이트에는 지원자당 이력서를 하나만
        둘 수 있으므로 지원하는 모든 직무에 맞게 작성해야 한다.
    kind: official
    sources:
      - url: https://www.metacareers.com/hiring-process/
        seen: "2026-11-15"
    checked: "2026-11-15"
hiringProcess:
  value:
    en: >-
      Most roles start with a recruiter call, or an online prescreen form for some roles. Phone or video
      screening interviews follow, with coding or a case study for technical roles, then a full loop with
      several employees. Meta says it usually takes 2 to 3 months.
    ko: >-
      대부분 리크루터 통화로 시작하며, 일부 직무는 온라인 사전 질문지를 쓴다. 이어서 전화나 화상 스크리닝
      면접(기술 직군은 코딩이나 사례 과제 포함)을 거쳐 여러 직원과의 풀 루프 면접을 본다. 보통 2~3개월이
      걸린다고 한다.
  kind: official
  sources:
    - url: https://www.metacareers.com/hiring-process/
      seen: "2026-11-15"
  checked: "2026-11-15"
reapplyWait:
  - value:
      after: onsite
      wait:
        en: >-
          Candidates most often report about 6 months after a failed full loop before reapplying for a
          similar role. Some report a year or more, for example after a weak design round.
        ko: >-
          풀 루프 면접에서 떨어진 뒤 비슷한 직무에 다시 지원하기까지 약 6개월이라는 보고가 가장 많다. 설계
          면접 결과가 나빴던 경우 등에는 1년 이상이라는 사례도 있다.
    kind: reported
