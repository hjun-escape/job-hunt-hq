        your own.
      ko: >-
        Meta의 여섯 가지 가치는 빠른 실행, 야심 차고 오래가는 성과, 솔직하지만 존중하는 토론, 대면 근무를
        중시하며 새 제품을 먼저 써 보는 태도, 회사를 내 것처럼 여기는 주인의식을 강조한다.
