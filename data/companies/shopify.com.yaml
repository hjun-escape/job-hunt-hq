hiringProcess:
  value:
    en: >-
      A 2022 Shopify Engineering guide lists four interviews for individual contributors, varying by role: the
      Life Story (an hour with a recruiter), 40 minutes of coding, 75 to 90 minutes of pair programming and a
      60-minute deep dive. Today's candidate guide names only the Life Story.
  kind: official
