applicationRules:
  - value:
      en: >-
        Before the Life Story interview, Shopify asks candidates to read its candidate guide on culture,
        leadership and everyday AI use. It says it is fine to withdraw at that point if the culture does not
        suit you.
    kind: official
    sources:
      - url: https://www.shopify.com/careers/candidate-guide/are-you-ready
        seen: "2026-11-18"
      - url: https://www.shopify.com/careers/candidate-guide/ai-usage
        seen: "2026-11-18"
    checked: "2026-11-18"
  - value:
      en: >-
        Besides the usual application, Shopify offers an alternative route for builders: skip the resume and
        show what you have made instead.
