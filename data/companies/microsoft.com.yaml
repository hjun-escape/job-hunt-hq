applicationRules:
  - value:
      en: >-
        Represent yourself honestly at every stage. AI may help you prepare, but in assessments and
        interviews you must show your own skills without outside help unless you are told otherwise.
      ko: >-
        모든 단계에서 자신을 정직하게 소개해야 한다. 준비에는 AI를 써도 되지만, 평가와 면접에서는 따로 허용되지
        않는 한 외부 도움 없이 본인의 실력을 보여야 한다.
    kind: official
    sources:
      - url: https://careers.microsoft.com/v2/global/en/hiring-tips.html
        seen: "2026-11-15"
    checked: "2026-11-15"
hiringProcess:
  value:
    en: >-
      After a resume review, some teams hold a brief screening call. Most interview rounds are 2 to 4
      conversations of up to an hour with future teammates and partner colleagues, by phone, Teams or in
      person. Some roles add coding, a portfolio or work samples.
    ko: >-
      서류 검토 후 일부 팀은 짧은 스크리닝 통화를 한다. 면접은 보통 함께 일할 팀원 및 협업 부서 동료와의
      대화 2~4회로, 각각 최대 1시간이며 전화, Teams 또는 대면으로 진행된다. 직무에 따라 코딩, 포트폴리오,
      작업 샘플이 추가된다.
  kind: official
  sources:
    - url: https://careers.microsoft.com/v2/global/en/hiring-tips.html
      seen: "2026-11-15"
  checked: "2026-11-15"
