applicationRules:
  - value:
      en: >-
        Hootsuite says it may use AI tools to source and screen candidates and to summarise interviews and
        interviewer feedback, but people make every final hiring decision. Its job postings disclose this.
    kind: official
    sources:
      - url: https://careers.hootsuite.com/privacy-policy
        seen: "2026-11-15"
    checked: "2026-11-15"
  - value:
      en: >-
        For technical roles, multiple-choice assessments are scored automatically and you may ask for a human
        review. Coding assignments and whiteboarding sessions are run and reviewed by people.
    kind: official
    sources:
      - url: https://careers.hootsuite.com/privacy-policy
        seen: "2026-11-15"
    checked: "2026-11-15"
hiringProcess:
  value:
    en: >-
      Hootsuite does not publish fixed interview stages. Its careers pages mention phone, video or in-person
      interviews, assessments and coding exercises for technical roles, and background checks where a role
      needs one. Each posting says whether the job is in-office, hybrid or remote.
  kind: official
  sources:
    - url: https://careers.hootsuite.com/privacy-policy
      seen: "2026-11-15"
    - url: https://careers.hootsuite.com/
      seen: "2026-11-15"
  checked: "2026-11-15"
