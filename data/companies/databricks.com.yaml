    en: To simplify and democratize data and AI, helping data and AI teams solve the hardest problems.
    ko: 데이터와 AI를 더 쉽고 누구나 쓸 수 있게 만들어, 데이터와 AI 팀이 가장 어려운 문제를 풀도록 돕는 것.
